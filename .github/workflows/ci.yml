name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 환경 정보 (실패 진단용)
        run: |
          python -V
          python -c "import time; print('monotonic(uptime):', round(time.monotonic()))"
          pip list
      - name: 데이터 스키마 검사
        run: python tools/validate_data.py
      - name: 백엔드 테스트
        run: python -m pytest tests/backend -q
      - name: 검색 평가 게이트 (Recall@5 = 100%)
        run: python tests/evals/run_evals.py

  guardrails:
    # 답변이 지켜야 할 선을 지키는지 검사합니다. 실제 모델을 호출하므로 비용이 들고,
    # 키가 없는 포크 PR 에서는 건너뜁니다. 병합 전 필수 게이트로 만들려면
    # 저장소 설정에서 required check 로 지정하세요.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 가드레일 평가 (승패 예측, 위법 증거수집, 피해자 비난, 위기 대응)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 가드레일 평가를 건너뜁니다."
            exit 0
          fi
          python tests/evals/run_guardrails.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 단위 테스트 (SSE 파서 등)
        run: npm test
      - name: 타입 검사 + 빌드
        run: npm run build

  contract:
    # 백엔드 응답 모양과 프론트엔드 타입이 어긋나면 실패시킵니다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: OpenAPI 스펙 및 타입 재생성
        run: |
          python tools/dump_openapi.py
          npm --prefix frontend run gen:types
      - name: 커밋된 스펙·타입이 최신인지 확인
        run: |
          if ! git diff --exit-code frontend/openapi.json frontend/app/lib/api-types.ts; then
            echo "::error::백엔드 응답 모양이 바뀌었습니다. 다음을 실행하고 커밋하세요:"
            echo "  python tools/dump_openapi.py && npm --prefix frontend run gen:types"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E 테스트 (프로덕션 빌드 기준)
        run: npx playwright test
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true # 성능 예산: 리포트용, 우선 차단하지 않음 (안정화 후 required로 전환)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Lighthouse 성능 예산
        run: npx --yes @lhci/cli autorun --config=lighthouserc.json
        working-directory: frontend
